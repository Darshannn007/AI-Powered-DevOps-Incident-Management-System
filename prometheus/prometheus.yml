global:
  scrape_interval: 5s
  evaluation_interval: 5s

# Connect Prometheus to Alertmanager container
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# Load alerting rules
rule_files:
  - '/etc/prometheus/alert_rules.yml'

scrape_configs:
  - job_name: 'apdims-backend'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'APDIMS Spring Boot Backend'
