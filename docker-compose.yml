services:
  # 1. MySQL Database
  mysql:
    image: mysql:8.0
    container_name: apdims-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Darshandesale@6859
      MYSQL_DATABASE: apdims_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # 2. Prometheus (Scrapes Spring Boot metrics every 5s)
  prometheus:
    image: prom/prometheus:latest
    container_name: apdims-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - alertmanager

  # 3. Alertmanager (Dispatches fired Prometheus alerts to APDIMS Webhook)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: apdims-alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 4. Grafana (Visual dashboards on port 3000)
  grafana:
    image: grafana/grafana:latest
    container_name: apdims-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  mysql_data:
  grafana_data:
