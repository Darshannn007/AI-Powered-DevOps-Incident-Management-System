global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'apdims-backend-webhook'

receivers:
  - name: 'apdims-backend-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/v1/alerts/webhook/alertmanager'
        send_resolved: true
