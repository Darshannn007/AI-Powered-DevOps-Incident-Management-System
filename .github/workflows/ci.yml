# ==================================================
# APDIMS CI Pipeline — GitHub Actions
# ==================================================
# when code get pushed - then follow this steps
#
# What will happen:
# 1. ubuntu server will start (GitHub ka free server)
# 2. Java 21 will install
# 3. Maven - build
# 4. if build fail → Red ❌ - on GitHub
# 5. if build pass → Green ✅ - on GitHub
# ==================================================

name: APDIMS CI Pipeline

# when start? — Push or Pull Request pe (on main branch)
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ──────────────────────────────────────────────────
  # JOB 1: Backend Build & Test
  # ──────────────────────────────────────────────────
  backend-build:
    name: 🔧 Backend Build & Test
    runs-on: ubuntu-latest    # use GitHub free Ubuntu server

    steps:
      # Step 1: download Code(checkout)
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Java 21 install
      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'        # Maven dependencies cache(fast build)

      # Step 3: Maven build (compile + test)
      - name: 🔨 Build with Maven
        run: mvn -B compile -f backend/pom.xml
        # -B = batch mode (no interactive prompts)
        # compile = only compile (test skip - because there is no db in CI)

      # Step 4: Build artifact (JAR file)
      - name: 📦 Package JAR
        run: mvn -B package -DskipTests -f backend/pom.xml
        # -DskipTests = tests skip (because there is no MySql(db) in CI)
        # package = make a .jar file

      # Step 5: upload JAR file  (can download later)
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apdims-backend-jar
          path: backend/target/*.jar
          retention-days: 7     # last till 7 days

  # ──────────────────────────────────────────────────
  # JOB 2: Frontend Build
  # ──────────────────────────────────────────────────
  frontend-build:
    name: 🎨 Frontend Build
    runs-on: ubuntu-latest

    steps:
      # Step 1: download code
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Step 2: install node.js
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Step 3: Dependencies install (npm install)
      - name: 📥 Install Dependencies
        run: npm ci
        working-directory: frontend
        # npm ci = clean install (faster + exact versions from lock file)

      # Step 4: npm run build
      - name: 🔨 Build Frontend
        run: npm run build
        working-directory: frontend

      # Step 5: upload Build output
      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apdims-frontend-dist
          path: frontend/dist
          retention-days: 7
