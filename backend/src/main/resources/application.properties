spring.application.name=APDIMS - AI Powered DevOps Incident Management System
server.port=8080

# Database Configuration (Docker MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/apdims_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_IN_LOCAL_OR_ENV}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator & Prometheus Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:GEMINI_API_KEY_HERE}
gemini.api.model=gemini-3.5-flash

# JWT Configuration
jwt.secret=${JWT_SECRET:apdims-default-jwt-secret-key-change-for-production}
jwt.expiration=86400000

# Slack Notification Configuration
slack.webhook.url=${SLACK_WEBHOOK_URL:SLACK_WEBHOOK_URL_HERE}
slack.enabled=true

# Spring Boot will automatically use local file if present
spring.profiles.include=local