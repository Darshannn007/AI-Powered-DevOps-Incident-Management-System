spring.application.name=APDIMS - AI Powered DevOps Incident Management System
server.port=8080

# Database Configuration (Docker MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/apdims_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Darshandesale@6859
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Actuator & Prometheus Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.model=gemini-1.5-flash

# JWT Configuration
jwt.secret=apdims-super-secret-key-darshan-2024-very-long-string-for-security
jwt.expiration=86400000

# Slack Notification Configuration
slack.webhook.url=${SLACK_WEBHOOK_URL:YOUR_SLACK_WEBHOOK_URL_HERE}
slack.enabled=true

# Spring Boot will automatically use local file if present
spring.profiles.include=local
